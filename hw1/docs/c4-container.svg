  <text x="710" y="119" text-anchor="middle" class="person-type">[Person]</text>

  <rect x="40" y="165" width="1720" height="1040" rx="8" fill="#f8fbff" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 8"/>

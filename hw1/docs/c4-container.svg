  <text x="1575" y="843" text-anchor="middle" class="node-type">[Container: Message broker]</text>
  <text x="1575" y="868" text-anchor="middle" class="node-desc">Доменные события</text>

  <path d="M830 890 V950" class="owns"/>
  <path d="M1210 890 V950" class="owns"/>


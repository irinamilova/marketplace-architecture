<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; fill: #111827; }
      .boundary-title { font-size: 22px; font-weight: 700; fill: #374151; }
      .node-title { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .node-type { font-size: 13px; fill: #e5effa; }
      .node-desc { font-size: 15px; fill: #ffffff; }
      .db-title { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .db-type { font-size: 13px; fill: #e5effa; }
      .person-title { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .person-type { font-size: 13px; fill: #dbeafe; }
      .edge { fill: none; stroke: #374151; stroke-width: 2.5; marker-end: url(#arrow); }
      .async { stroke-dasharray: 9 7; }
      .owns { fill: none; stroke: #6b7280; stroke-width: 2; }
      .edge-label { font-size: 14px; font-weight: 600; fill: #374151; paint-order: stroke; stroke: #ffffff; stroke-width: 7px; stroke-linejoin: round; }
      .legend { font-size: 14px; fill: #374151; }
    </style>
  </defs>

  <rect width="1800" height="1250" fill="#ffffff"/>
  <text x="900" y="38" text-anchor="middle" class="title">C4 Container Diagram: Marketplace</text>

  <rect x="220" y="65" width="260" height="75" rx="10" fill="#08427b"/>

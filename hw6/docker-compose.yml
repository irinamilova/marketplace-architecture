name: warehouse-hw6

x-app: &app
  image: warehouse-hw6-python:local
  build: .

x-cassandra: &cassandra
  image: cassandra:5.0.6
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local'"]
    interval: 10s
    timeout: 8s
    retries: 40
    start_period: 40s

x-cassandra-env: &cassandra-env
  CASSANDRA_CLUSTER_NAME: SmartWarehouse
  CASSANDRA_DC: dc1
  CASSANDRA_RACK: rack1
  CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
  CASSANDRA_SEEDS: cassandra-1
  MAX_HEAP_SIZE: 512M
  HEAP_NEWSIZE: 100M
  JVM_OPTS: -XX:ActiveProcessorCount=2
  CASSANDRA_NUM_TOKENS: 16

x-api-health: &api-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=10).close()"]
  interval: 10s
  timeout: 12s
  retries: 30
  start_period: 15s

services:
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: BROKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms192m -Xmx384m
    volumes: [kafka:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 3s
      retries: 30

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 3s
      retries: 30

  cassandra-1:
    <<: *cassandra
    environment: *cassandra-env
    volumes: [cassandra1:/var/lib/cassandra]

  cassandra-2:
    <<: *cassandra
    environment:
      <<: *cassandra-env
      CASSANDRA_RACK: rack2
    depends_on:
      cassandra-1: {condition: service_healthy}
    volumes: [cassandra2:/var/lib/cassandra]

  cassandra-3:
    <<: *cassandra
    environment:
      <<: *cassandra-env
      CASSANDRA_RACK: rack3
    depends_on:
      cassandra-2: {condition: service_healthy}
    volumes: [cassandra3:/var/lib/cassandra]

  bootstrap:
    <<: *app
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      cassandra-1: {condition: service_healthy}
      cassandra-2: {condition: service_healthy}
      cassandra-3: {condition: service_healthy}
      schema-registry: {condition: service_healthy}

  wms:
    <<: *app
    restart: unless-stopped
    command: ["uvicorn", "app.producer:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:${WMS_PORT:-8061}:8000"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck: *api-health

  consumer:
    <<: *app
    restart: unless-stopped
    command: ["uvicorn", "app.consumer:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:${CONSUMER_PORT:-8062}:8000"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck: *api-health

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9096}:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    depends_on:
      prometheus: {condition: service_healthy}
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/dashboard.json:/etc/grafana/dashboards/warehouse.json:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3060}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  tests:
    <<: *app
    profiles: [test]
    command: ["python", "-m", "unittest", "-v", "tests.integration"]
    depends_on:
      consumer: {condition: service_healthy}
      wms: {condition: service_healthy}
      grafana: {condition: service_healthy}

volumes:
  kafka:
  cassandra1:
  cassandra2:
  cassandra3:
  prometheus:
  grafana:

global:
  scrape_interval: 3s
  evaluation_interval: 3s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: warehouse-consumer
    metrics_path: /metrics
    static_configs:
      - targets: [consumer:8000]
  - job_name: warehouse-lag
    metrics_path: /metrics
    static_configs:
      - targets: [wms:8000]

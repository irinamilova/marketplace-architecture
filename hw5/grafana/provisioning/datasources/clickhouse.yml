apiVersion: 1
datasources:
  - name: ClickHouse
    uid: cinema-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: grafana
      defaultDatabase: cinema
      defaultTable: daily_aggregates
      secure: false
    secureJsonData:
      password: cinema_dashboard
